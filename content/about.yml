title: About
description: About
content: |
    Hi, my name is **Lazar Bojanić**. I'm a 3rd year Computer Science student. My main interests are computer graphics and game development, currently i'm working on a Full-Stack mobile project. Outside of school, I enjoy cycling, cooking, board games and listening to music.

    ## Skills & Technologies

    - Frontend mainly Vue/Nuxt for the web and Compose Multiplatform for mobile. For backend usually Java/Kotlin (SpringBoot/Ktor). Familiar with C/C++ enough that i built my own OpenGL renderer from scratch. Otherwise familiar C#, Javascript/Typescript and a bit of Python.
